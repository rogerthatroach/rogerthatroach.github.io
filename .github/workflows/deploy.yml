name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Third-party actions are pinned to full commit SHAs (supply-chain
# hardening — floating @v4 tags are re-pointable). Dependabot
# (.github/dependabot.yml) keeps these SHAs current. Version in the
# trailing comment.
jobs:
  # Keep type safety and dependency advisories as an explicit deployment gate.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Verify Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages must publish through GitHub Actions."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --audit-level=high

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run verify:export

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          include-hidden-files: true
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
