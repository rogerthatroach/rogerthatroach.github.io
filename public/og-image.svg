<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0c0a0a"/>

  <!-- Subtle gradient overlay -->
  <rect width="1200" height="630" fill="url(#grad)" opacity="0.3"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#b07a82" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0c0a0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="200" y2="0">
      <stop offset="0%" stop-color="#b07a82"/>
      <stop offset="100%" stop-color="#b07a82" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Content -->
  <g transform="translate(80, 130)">
    <!-- Eyebrow -->
    <text font-family="monospace" font-size="14" letter-spacing="4" fill="#b07a82" opacity="0.9">
      MACHINE LEARNING ENGINEER · AI &amp; DATA SCIENCE LEAD
    </text>

    <!-- Name -->
    <text y="65" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#f0ece8">
      Harmilap Singh Dhaliwal
    </text>

    <!-- Portfolio identity -->
    <text y="110" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a09890">
      Production systems from concept to delivery.
    </text>

    <!-- Accent line -->
    <rect y="140" width="200" height="1" fill="url(#accent-line)"/>

    <!-- Broad portfolio scope -->
    <text y="195" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#f0ece8">
      Text, search, applied ML, and governed AI
    </text>
    <text y="232" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#8a8078">
      8+ years across industrial ML, document intelligence, and
    </text>
    <text y="259" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#8a8078">
      regulated finance. Hands-on from architecture through operation.
    </text>

    <!-- Metrics row -->
    <g transform="translate(0, 320)">
      <text font-family="monospace" font-size="28" font-weight="700" fill="#f0ece8">$3M</text>
      <text x="85" font-family="monospace" font-size="12" fill="#8a8078" dy="4">annual savings</text>

      <text x="280" font-family="monospace" font-size="28" font-weight="700" fill="#f0ece8">99.95%</text>
      <text x="415" font-family="monospace" font-size="12" fill="#8a8078" dy="4">checkbox detection</text>

      <text x="720" font-family="monospace" font-size="28" font-weight="700" fill="#f0ece8">3</text>
      <text x="755" font-family="monospace" font-size="12" fill="#8a8078" dy="4">production AI systems at RBC</text>
    </g>
  </g>

  <!-- Decorative dots (subtle) -->
  <circle cx="1050" cy="200" r="2" fill="#b07a82" opacity="0.2"/>
  <circle cx="1080" cy="220" r="1.5" fill="#b07a82" opacity="0.15"/>
  <circle cx="1100" cy="190" r="1" fill="#b07a82" opacity="0.1"/>
  <circle cx="1060" cy="250" r="2.5" fill="#b07a82" opacity="0.1"/>

  <!-- Bottom bar -->
  <rect y="610" width="1200" height="20" fill="#b07a82" opacity="0.1"/>
</svg>
